[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vidmeta"
version = "2.0.0"
description = "VidMeta AI — Analyze local videos and generate platform-ready metadata"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "opencv-python-headless>=4.9.0",
    "Pillow>=12.0.0,<12.1.0",
    "faster-whisper>=1.0.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "google-generativeai>=0.7.0",
    "requests>=2.33.0",
    "filelock>=3.20.3",
    "boto3>=1.35.0",
    "tenacity>=8.2.0",
    "slowapi>=0.1.9",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
offline-diarization = [
    "resemblyzer>=0.1.4",
    "librosa>=0.10.2",
    "scikit-learn>=1.5.0",
    "numpy>=1.26.0",
]
frames = [
    "scenedetect>=0.6.4",
    "ultralytics>=8.3.0",
    "easyocr>=1.7.0",
    "moondream>=1.1.0",
]
cloud-diarization = [
    "pyannote.audio>=3.3.2",
]

[project.scripts]
vidmeta = "vidmeta.cli:main"

[tool.setuptools.packages.find]
include = ["vidmeta*", "api*"]
