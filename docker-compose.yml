services:
  vidmeta:
    build: .
    ports:
      - "8000:8000"
    environment:
      VIDMETA_MAX_UPLOAD_MB: "${VIDMETA_MAX_UPLOAD_MB:-2048}"
      VIDMETA_DATA_DIR: "/data"
    volumes:
      - ./videos:/videos:ro
      - vidmeta-data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  vidmeta-data:
