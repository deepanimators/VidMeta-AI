name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-13
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Python sidecar ────────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install .
          pip install pyinstaller

      - name: Build vidmeta-server sidecar
        run: python build/build_sidecar.py

      - name: Copy sidecar binary to Tauri binaries (Unix)
        if: runner.os != 'Windows'
        run: |
          mkdir -p desktop/src-tauri/binaries
          cp dist/vidmeta-server desktop/src-tauri/binaries/vidmeta-server-${{ matrix.target }}
          chmod +x desktop/src-tauri/binaries/vidmeta-server-${{ matrix.target }}

      - name: Copy sidecar binary to Tauri binaries (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries
          Copy-Item dist/vidmeta-server.exe desktop/src-tauri/binaries/vidmeta-server-${{ matrix.target }}.exe

      # ── Web frontend ──────────────────────────────────────────────────────
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build web frontend
        working-directory: web
        run: |
          npm ci
          npm run build

      # ── Rust / Tauri ──────────────────────────────────────────────────────
      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target

      - name: Install Tauri desktop dependencies (macOS)
        if: runner.os == 'macOS'
        working-directory: desktop
        run: npm ci

      - name: Install Tauri desktop dependencies (Windows)
        if: runner.os == 'Windows'
        working-directory: desktop
        run: npm ci

      - name: Build Tauri app
        working-directory: desktop
        run: |
          npx tauri icon src-tauri/icons/icon.png
          npx tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # ── Upload artifacts ──────────────────────────────────────────────────
      - name: Upload macOS artifacts
        if: runner.os == 'macOS'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz

      - name: Upload Windows artifacts
        if: runner.os == 'Windows'
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
